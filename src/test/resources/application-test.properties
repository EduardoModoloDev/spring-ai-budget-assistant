# Perfil usado automaticamente pelos testes (ver build.gradle)
spring.datasource.url=jdbc:h2:mem:budgeting-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Sem chave real os testes de integração (*IT) são pulados; o valor abaixo é só um marcador
spring.ai.openai.api-key=${OPENAI_API_KEY:chave-falsa-para-testes}
