# Perfil para rodar sem Docker/MySQL: ./gradlew bootRun --args='--spring.profiles.active=local'
# Os dados ficam em memória e somem quando a aplicação para.
spring.docker.compose.enabled=false
spring.datasource.url=jdbc:h2:mem:budgeting;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
